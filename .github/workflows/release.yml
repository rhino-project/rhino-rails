name: Release to RubyGems

on:
  push:
    branches:
      - 'release/v*'

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Run tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

  release:
    needs: tests
    runs-on: ubuntu-latest
    name: Publish gem, then tag and release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from branch name
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (gem version ${TAG#v})"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Verify gemspec version matches release branch
        run: |
          GEM_VERSION="$(ruby -e 'require_relative "lib/rhino/version"; puts Rhino::VERSION')"
          if [ "$GEM_VERSION" != "${{ steps.version.outputs.number }}" ]; then
            echo "::error::gemspec version ($GEM_VERSION) does not match release branch version (${{ steps.version.outputs.number }})"
            exit 1
          fi

      - name: Configure RubyGems trusted publishing
        uses: rubygems/configure-rubygems-credentials@v2.0.0

      - name: Build and publish gem
        run: |
          gem build rhino-rails.gemspec
          gem push "rhino-rails-${{ steps.version.outputs.number }}.gem"

      - name: Verify gem is live on RubyGems
        run: |
          TARGET="${{ steps.version.outputs.number }}"
          for i in $(seq 1 12); do
            LATEST="$(gem list --remote --exact rhino-rails | sed -nE 's/.*\(([^),]+).*/\1/p')"
            if [ "$LATEST" = "$TARGET" ]; then
              echo "Confirmed rhino-rails $TARGET is live on RubyGems"
              exit 0
            fi
            echo "RubyGems latest is '$LATEST', waiting for '$TARGET' ($i/12)..."
            sleep 10
          done
          echo "::error::RubyGems did not reflect $TARGET after publishing"
          exit 1

      - name: Create tag (idempotent)
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on origin — skipping."
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
